<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cursed Energy Clicker</title>
<style>
:root{
  --bg:#0d0a1a;--panel:#171230;--line:#2c2557;--text:#e9e6ff;--dim:#8f89bd;
  --ce:#4aa8ff;--glow:#7a5cff;--red:#ff3b5c;--gold:#f2c14e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#0d0a1a;}
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 30% 0,#1d1550 0,var(--bg) 55%);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.wrap{grid-template-columns:360px 1fr}}
h1{margin:0;font-size:1.3rem;letter-spacing:.04em}
.sub{color:var(--dim);font-size:.85rem;margin:2px 0 0}
.left{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.chars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#tlist,#alist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#tlist .act,#alist .act{margin-top:0}
#adm{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:#000c}
#adm[hidden]{display:none}
.abox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.abox h2{margin:0 0 10px;color:var(--gold);font-size:1.1rem}
.abox h3{margin:12px 0 6px;font-size:.85rem;color:var(--dim)}
.agb{display:flex;flex-wrap:wrap;gap:6px}
.abox button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.abox button:hover{border-color:var(--ce)}
.abox input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
#amsg{color:var(--red);min-height:1.2em;margin:6px 0}
#cut{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
#cut[hidden]{display:none}
#cut[data-bg=red]{background:radial-gradient(circle,#5a0a1a,#000)}
#cut[data-bg=blue]{background:radial-gradient(circle,#0a2a6a,#000)}
#cut[data-bg=gold]{background:radial-gradient(circle,#5a4510,#000)}
.cbox{max-width:560px;width:100%;text-align:center}
#ctitle{color:var(--gold);font-weight:700;margin-bottom:8px;min-height:1.2em}
#ctext{font-size:1.15rem;line-height:1.5;min-height:5em}
#stage{display:flex;justify-content:center;align-items:flex-end;gap:36px;min-height:190px;margin-bottom:12px}
.fig{width:130px;opacity:.5;filter:saturate(.6);transition:opacity .2s,transform .2s;--c:#fff}
.fig.act{opacity:1;filter:none;transform:scale(1.06)}
.fig svg,.fig img{display:block;width:100%;height:150px;object-fit:contain;color:#06041a;filter:drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 3px var(--c))}
.fig .nm{font-size:.8rem;color:var(--c);margin-top:6px;font-weight:700}
.fig.hit{animation:hit .4s}
.fig.dead svg,.fig.dead img{transform:rotate(80deg) translateX(20px);opacity:.45}
@keyframes hit{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.fig.hit{animation:none}}
#cbars{display:grid;gap:8px;text-align:left;margin:12px 0}
#cg{background:linear-gradient(90deg,var(--ce),#fff)}
.chars button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.chars button.on{border-color:var(--gold);color:var(--gold)}
.chars button:focus-visible{outline:2px solid var(--gold)}
.perk{min-height:2.4em}
body.vessel #orb{box-shadow:0 0 40px var(--red),inset 0 0 40px #0008}
.score{font-size:2.3rem;font-weight:700;color:var(--ce);text-shadow:0 0 18px var(--glow)}
.rate{color:var(--dim);font-size:.9rem}

#orb:active{transform:scale(.94)}
#orb:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.float{position:fixed;pointer-events:none;font-weight:700;color:var(--ce);text-shadow:0 0 8px var(--glow);animation:up .9s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.float{animation:none;opacity:0}}
.bar{width:100%;height:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .15s}
.curse{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.curse b{color:var(--red)}
.hp{height:10px;background:#2a1020;border-radius:5px;overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:var(--red);width:100%;transition:width .15s}
button.act{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin-top:8px}
button.act:disabled{background:#443;color:#888;cursor:not-allowed}
.right h2{font-size:1rem;margin:0 0 8px;color:var(--gold)}
.list{display:grid;gap:8px;margin-bottom:18px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%}
.item.art{background-size:cover;background-position:center;border-color:var(--red)}
.item.art b,.item.art small{text-shadow:0 1px 4px #000}
.item:hover:not(:disabled){border-color:var(--ce)}
.item:disabled{opacity:.45;cursor:not-allowed}
.item:focus-visible{outline:2px solid var(--gold)}
.item small{display:block;color:var(--dim)}
.cost{color:var(--ce);font-weight:700;white-space:nowrap}
.own{color:var(--gold);font-size:.85rem}
.foot{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:.8rem}
.foot button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <section class="left">
    <div><h1>Cursed Energy Clicker</h1><p class="sub">Channel energy. Exorcise curses. Expand your domain.</p><button class="act rst" style="margin-top:6px;background:#3a2a60">Restart</button></div>
    <div class="chars" id="chars"></div>
    <div class="rate perk" id="perk"></div>
    <div class="score" id="score">0</div>
    <div class="rate" id="rate"></div>
    <button id="orb" aria-label="Channel cursed energy"></button>
    <div class="curse">
      <div>Curse: <b id="cname"></b> <span id="cgrade" class="own"></span></div>
      <div class="hp"><i id="chp"></i></div>
      <button class="act" id="strike">Strike curse (10x damage)</button>
    </div>
    <div class="curse" style="text-align:left">
      <div class="rate" id="fing"></div>
      <button class="act" id="eat" disabled>Eat Sukuna finger</button>
      <button class="act" id="geto" hidden style="background:var(--glow)">Fight Suguru Geto</button>
      <div class="rate" id="msg" aria-live="polite" style="color:var(--gold);min-height:1.2em;margin-top:6px"></div>
    </div>
    <div class="curse" id="tpanel" style="text-align:left" hidden><div class="rate">Techniques</div><div id="tlist"></div><button class="act" id="swap" hidden></button></div>
    <div class="curse" id="apanel" style="text-align:left" hidden><div class="rate">Allies: summon against Heian Era Sukuna</div><div id="alist"></div></div>
    <div style="width:100%;text-align:left">
      <div class="rate" id="dlabel">Domain Expansion charge</div>
      <div class="bar"><i id="dbar"></i></div>
      <button class="act" id="domain" disabled>Domain Expansion</button>
    </div>
  </section>
  <section class="right">
    <h2>Sorcerers (auto-earn)</h2>
    <div class="list" id="gens"></div>
    <h2>Techniques (click power)</h2>
    <div class="list" id="ups"></div>

<div id="adm" hidden role="dialog" aria-modal="true" aria-label="Admin panel"><div class="abox"><h2>Admin Panel</h2><div id="alock"><input id="acode" type="password" placeholder="Enter admin code" autocomplete="off"><button id="aok">Unlock</button></div><div id="amsg" aria-live="polite"></div><div id="atools" hidden></div><div style="margin-top:14px"><button id="aclose">Close</button></div></div></div>
<div id="cut" hidden role="dialog" aria-modal="true" aria-label="Cutscene"><div class="cbox"><div id="stage"></div><div id="ctitle"></div><p id="ctext"></p><div id="cbars" hidden><div>Gojo<div class="bar"><i id="cg"></i></div></div><div>Sukuna<div class="bar"><i id="cs"></i></div></div></div><button class="act" id="cnext">Continue</button></div></div>
<script>
const GENS=[
 {id:'g1',name:'Grade 4 Sorcerer',desc:'Reliable. Barely.',base:15,cps:0.2},
 {id:'g2',name:'Grade 2 Sorcerer',desc:'Seasoned exorcist.',base:120,cps:1.5},
 {id:'g3',name:'Grade 1 Sorcerer',desc:'Handles serious threats.',base:900,cps:9},
 {id:'g4',name:'Special Grade Sorcerer',desc:'Reality-bending output.',base:7000,cps:55},
 {id:'g5',name:'The Strongest',desc:'Limitless. Unlocks a fight with Suguru Geto.',base:55000,cps:340},
 {id:'g6',name:'King of Curses',desc:'Slashes everything in sight.',base:450000,cps:2200}
];
const UPS=[
 {id:'u1',name:'Black Flash',desc:'+1 per click',base:50,add:1},
 {id:'u2',name:'Reverse Cursed Technique',desc:'+5 per click',base:400,add:5},
 {id:'u3',name:'Binding Vow',desc:'+25 per click',base:3500,add:25},
 {id:'u4',name:'Simple Domain',desc:'+150 per click',base:30000,add:150},
 {id:'u5',name:'Maximum Output',desc:'+1000 per click',base:260000,add:1000}
];
const CURSES=[
 {n:'Finger Bearer',g:'Grade 2',m:1,w:3,finger:1},
 {n:'Cursed Spirit',g:'Grade 3',m:.6,w:2},
 {n:'Hanami',g:'Special Grade',m:2.2,w:.25},
 {n:'Jogo',g:'Special Grade',m:2.6,w:.25},
 {n:'Mahito',g:'Special Grade',m:3,w:.25},
 {n:'Dragon',g:'Special Grade',m:3.4,w:.25},
 {n:'Kenjaku',g:'Special Grade',m:4,w:.25}
];
const GETO={n:'Suguru Geto',g:'Special Grade',m:14,boss:1,geto:1};
const HEIAN={n:'Heian Era Sukuna',g:'King of Curses',m:80,boss:1,final:1};
const DOMAIN_MAX=100;
function load(){try{return JSON.parse(localStorage.getItem('cejjk'))}catch(e){return null}}
function save(){try{localStorage.setItem('cejjk',JSON.stringify(S))}catch(e){}}
let S=Object.assign({ce:0,total:0,clicks:0,gens:{},ups:{},cur:null,charge:0,boostUntil:0,kills:0,fingers:0,eaten:0,getoWins:0,char:'yuji',megumi:false,heian:false,gojoDead:false,swapped:false,won:false,copied:{},cd:{}},load()||{});
const $=id=>document.getElementById(id);
const fmt=n=>n<1e3?(n%1?n.toFixed(1):n):n<1e6?(n/1e3).toFixed(2)+'K':n<1e9?(n/1e6).toFixed(2)+'M':n<1e12?(n/1e9).toFixed(2)+'B':(n/1e12).toFixed(2)+'T';
const cost=(o,n)=>Math.ceil(o.base*Math.pow(1.15,n||0));
const vessel=()=>S.eaten>=3;
const boost=()=>Date.now()<S.boostUntil?(vessel()?5:3):1;
const isG=()=>S.char==='gojo'||S.char==='yutagojo';
const isY=()=>S.char==='yuta'||S.char==='yutagojo';
const isM=()=>S.char==='megumi';
const chm=()=>isG()?1.5:1;
const mult=()=>(1+.05*S.eaten)*(1+.1*S.getoWins)*(S.heian?4:S.megumi?3:vessel()?2:1)*(S.won?1.5:1);
function rawClick(){let p=1;UPS.forEach(u=>p+=u.add*(S.ups[u.id]||0));return p}
function rawCps(){let c=0;GENS.forEach(g=>c+=g.cps*(S.gens[g.id]||0));return c}
const clickPower=()=>rawClick()*mult()*boost()*(isG()?1.6:1)*(Date.now()<S.vulnUntil?2:1);
const cps=()=>rawCps()*mult()*boost()*(isY()?1.6:1)*(isM()?1.5:1)*(Date.now()<S.vulnUntil?2:1);
let mt;function say(t){$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='',5000)}
function spawn(c){
  const hp=Math.ceil((40+rawClick()*25+rawCps()*20)*mult()*c.m*(c.geto?(1+S.getoWins*.8):1));
  S.cur={n:c.n,g:c.g,boss:!!c.boss,final:!!c.final,geto:!!c.geto,finger:!!c.finger,max:hp,hp:hp};
}
function newCurse(){
  const wt=c=>c.n==='Kenjaku'&&S.heian&&!S.copied.Kenjaku?3:c.w;
  const tot=CURSES.reduce((a,c)=>a+wt(c),0);let r=Math.random()*tot;
  for(const c of CURSES){r-=wt(c);if(r<=0){spawn(c);return}}
  spawn(CURSES[0]);
}
if(!S.cur||!S.cur.max)newCurse();
function gain(n){S.ce+=n;S.total+=n;S.charge=Math.min(DOMAIN_MAX,S.charge+0.15*chm())}
function checkCurse(){
  if(S.cur.hp>0)return;
  const c=S.cur,reward=Math.ceil(c.max*6);
  S.ce+=reward;S.total+=reward;S.kills++;S.charge=Math.min(DOMAIN_MAX,S.charge+10*chm());
  let m='Exorcised '+c.n+' (+'+fmt(reward)+' CE).';
  if(c.finger){S.fingers++;m+=' It dropped a Sukuna finger!'}
  if(c.geto){S.getoWins++;m='Suguru Geto defeated! +10% CE permanently.'}
  if(isY()&&!c.final&&COPY[c.n]&&!S.copied[c.n]){S.copied[c.n]=1;m+=' Yuta copied '+COPY[c.n].name.replace('Copy: ','')+'!'}
  say(m);
  if(c.final){S.won=true;newCurse();play(['win']);return}
  newCurse();
}
$('orb').addEventListener('click',e=>{
  let p=clickPower(),crit=false;if(S.char==='yuji'&&Math.random()<.1){p*=5;crit=true}
  gain(p);S.clicks++;
  const f=document.createElement('div');f.className='float';f.textContent=(crit?'Black Flash! +':'+')+fmt(p);
  f.style.left=(e.clientX||innerWidth/2)-10+'px';f.style.top=(e.clientY||innerHeight/2)-20+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),900);
  S.cur.hp-=p;checkCurse();render();
});
$('strike').addEventListener('click',()=>{
  S.cur.hp-=Math.max(clickPower()*(isY()?20:10),cps()*3);checkCurse();render();
});
$('domain').addEventListener('click',()=>{
  if(S.charge<DOMAIN_MAX)return;S.charge=0;S.boostUntil=Date.now()+(isG()?30000:20000);render();
});
$('eat').addEventListener('click',()=>{
  if(S.fingers<1||S.eaten>=20)return;
  S.fingers--;S.eaten++;
  say(S.eaten===3?'Sukuna takes hold. You are now his vessel! All CE x2 and your domain becomes Malevolent Shrine (x5).':'You swallowed a Sukuna finger. All CE +5% ('+S.eaten+'/20 eaten).');
  if(S.eaten>=10&&!S.megumi){S.megumi=true;S.gojoDead=true;if(S.char==='gojo')S.char='yuji';play(['megumi','gojo'])}
  else if(S.eaten>=20&&!S.heian){S.heian=true;play(['heian'])}
  render();
});
$('geto').addEventListener('click',()=>{
  if(S.cur.boss)return;
  spawn(GETO);say('Suguru Geto stands before you. Defeat him to claim a permanent boost.');render();
});
function buy(kind,o){
  const store=kind==='g'?S.gens:S.ups;const c=cost(o,store[o.id]);
  if(S.ce>=c){S.ce-=c;store[o.id]=(store[o.id]||0)+1;
    if(o.id==='g5'&&store[o.id]===1)say('The Strongest joined you. Suguru Geto is now challenging you!');
    build();render()}
}
function build(){
  $('gens').innerHTML='';$('ups').innerHTML='';
  GENS.forEach(g=>mk($('gens'),g,'g'));UPS.forEach(u=>mk($('ups'),u,'u'));
}

function buildTechs(){const r=$('tlist');r.innerHTML='';TECHS.forEach(t=>{const b=document.createElement('button');b.className='act';b.id='t_'+t.id;b.addEventListener('click',()=>useTech(t));r.appendChild(b)})}
function useTech(t){const now=Date.now();if(!techOk(t)||(S.cd[t.id]||0)>now)return;S.cur.hp-=(clickPower()+cps()*.5)*t.mult;S.cd[t.id]=now+t.cd*1000;checkCurse();render()}
function renderTechs(){
  const now=Date.now();
  TECHS.forEach(t=>{const b=$('t_'+t.id),left=Math.ceil(((S.cd[t.id]||0)-now)/1000);b.hidden=!techOk(t);b.disabled=left>0;b.textContent=t.name+' ('+t.mult+'x)'+(left>0?' '+left+'s':'')});
  const sw=$('swap'),can=S.copied.Kenjaku&&S.gojoDead&&!S.swapped&&S.char==='yuta';
  sw.hidden=!can;sw.disabled=!S.heian||S.cur.boss;
  sw.textContent=S.heian?"Body Swap into Gojo's body":"Body Swap (waits for Sukuna's final form)";
  $('tpanel').hidden=!TECHS.some(techOk)&&sw.hidden;
  renderAllies();
}

});

  $('chp').style.width=Math.max(0,c.hp/c.max*100)+'%';
  $('dbar').style.width=(S.charge/DOMAIN_MAX*100)+'%';
  $('domain').disabled=S.charge<DOMAIN_MAX||boosted;
  $('fing').textContent='Sukuna fingers: '+S.fingers+' held · '+S.eaten+'/20 eaten (+'+(S.eaten*5)+'% CE)';
  $('eat').disabled=S.fingers<1||S.eaten>=20;
  if((S.char==='gojo'&&S.gojoDead)||(S.char==='megumi'&&S.megumi&&!S.won))S.char='yuji';
  CHARS.forEach(x=>{const b=$('c_'+x.id);b.classList.toggle('on',S.char===x.id);b.setAttribute('aria-pressed',S.char===x.id);
    b.hidden=x.id==='yutagojo'&&!S.swapped;b.disabled=(x.id==='gojo'&&S.gojoDead)||(x.id==='megumi'&&S.megumi&&!S.won);if(x.id==='megumi')b.textContent=b.disabled?'Megumi (possessed)':'Megumi';
    if(x.id==='gojo')b.textContent=S.gojoDead?'Gojo (dead)':'Gojo'});
  const ch=CHARS.find(x=>x.id===S.char)||CHARS[0];
  $('perk').textContent=ch.perk+(vessel()?" Sukuna's power: all CE x"+(S.heian?4:S.megumi?3:2)+".":"");
  $('domain').textContent=domainName();$('dlabel').textContent=domainName()+' charge';
  $('strike').textContent='Strike curse ('+(isY()?20:10)+'x damage)';
  document.body.classList.toggle('vessel',vessel());
  renderTechs();
  const gb=$('geto');gb.hidden=!(S.gens.g5>0);
  gb.textContent=S.getoWins?'Rematch Suguru Geto (beaten x'+S.getoWins+')':'Fight Suguru Geto';
  gb.disabled=c.boss;
  GENS.forEach(g=>upd(g,S.gens[g.id]||0));UPS.forEach(u=>upd(u,S.ups[u.id]||0));
  $('stats').textContent='Clicks: '+S.clicks+' · Curses exorcised: '+S.kills+' · Total CE: '+fmt(Math.floor(S.total));
}
function upd(o,n){
  const b=$('i_'+o.id),cc=cost(o,n);
  b.disabled=S.ce<cc;
  b.innerHTML='<span><b>'+o.name+'</b> <span class="own">x'+n+'</span><small>'+o.desc+'</small></span><span class="cost">'+fmt(cc)+'</span>';
}
const fresh=()=>({ce:0,total:0,clicks:0,gens:{},ups:{},cur:null,charge:0,boostUntil:0,kills:0,fingers:0,eaten:0,getoWins:0,char:'yuji',megumi:false,heian:false,gojoDead:false,swapped:false,won:false,copied:{},cd:{}});
let armed=0;
const rstLabel=t=>document.querySelectorAll('.rst').forEach(b=>b.textContent=t);
function restart(){
  if(!armed){armed=setTimeout(()=>{armed=0;rstLabel('Restart')},3000);rstLabel('Click again to confirm');return}
  clearTimeout(armed);armed=0;
  S=fresh();newCurse();try{localStorage.removeItem('cejjk')}catch(e){}
  rstLabel('Restart');build();render();say('Game restarted. Back to the beginning.');
}
document.querySelectorAll('.rst').forEach(b=>b.addEventListener('click',restart));
let last=Date.now();
setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(cutOn)return;const g=cps()*dt;if(g>0){S.ce+=g;S.total+=g;S.cur.hp-=g*0.5;checkCurse();S.charge=Math.min(DOMAIN_MAX,S.charge+dt*0.5*chm())}render()},200);
setInterval(save,5000);addEventListener('beforeunload',save);
const ALLIES=[
 {id:'todo',name:'Todo',line:'Todo claps. Boogie Woogie swaps the battlefield!',mult:100,cd:25},
 {id:'hakari',name:'Hakari',line:'Hakari rolls the Idle Death Gamble...',mult:70,cd:40,jackpot:1},
 {id:'maki',name:'Maki',line:'Maki cuts in with Playful Cloud.',mult:90,cd:30},
 {id:'nanami',name:'Nanami',line:'Nanami finds the 7:3 weak point.',mult:110,cd:35},
 {id:'inumaki',name:'Inumaki',line:'Inumaki speaks: "Stop." Sukuna takes double damage for 8s.',mult:50,cd:45,vuln:1},
 {id:'panda',name:'Panda',line:'Panda goes Gorilla Mode.',mult:60,cd:25},
 {id:'nobara',name:'Nobara',line:'Nobara drives a nail through the Straw Doll.',mult:80,cd:30}
];
function buildAllies(){const r=$('alist');r.innerHTML='';ALLIES.forEach(a=>{const b=document.createElement('button');b.className='act';b.id='a_'+a.id;b.addEventListener('click',()=>useAlly(a));r.appendChild(b)})}
function useAlly(a){
  const now=Date.now(),k='a_'+a.id;
  if(!S.cur.final||(S.cd[k]||0)>now)return;
  S.cur.hp-=(clickPower()+cps()*.5)*a.mult;S.cd[k]=now+a.cd*1000;
  let m=a.line;
  if(a.vuln)S.vulnUntil=now+8000;
  if(a.jackpot&&Math.random()<.25){S.boostUntil=now+30000;m="JACKPOT! Hakari's gamble pays off. Domain boost for 30s."}
  say(m);checkCurse();render();
}
function renderAllies(){
  const on=!!S.cur.final;$('apanel').hidden=!on;if(!on)return;
  const now=Date.now();
  ALLIES.forEach(a=>{const b=$('a_'+a.id),left=Math.ceil(((S.cd['a_'+a.id]||0)-now)/1000);b.disabled=left>0;b.textContent='Summon '+a.name+' ('+a.mult+'x)'+(left>0?' '+left+'s':'')});
}
const ADMIN_CODE='MODULOYUJI';
let admOK=false,admBuilt=false;
function setEaten(n){
  S.eaten=n;const ids=[];
  if(n>=10&&!S.megumi){S.megumi=true;S.gojoDead=true;if(S.char==='gojo')S.char='yuji';ids.push('megumi','gojo')}
  if(n>=20&&!S.heian){S.heian=true;ids.push('heian')}
  if(ids.length)play(ids);
}
function admAdd(group,label,fn,close){
  const r=$('atools');let g=$('ag_'+group.replace(/\W/g,''));
  if(!g){g=document.createElement('div');g.id='ag_'+group.replace(/\W/g,'');g.innerHTML='<h3>'+group+'</h3><div class="agb"></div>';r.appendChild(g)}
  const b=document.createElement('button');b.textContent=label;
  b.addEventListener('click',()=>{fn();if(close)$('adm').hidden=true;render();say('Admin: '+label)});
  g.querySelector('.agb').appendChild(b);
}
function buildAdmin(){
  [['+1K',1e3],['+1M',1e6],['+1B',1e9],['+1T',1e12]].forEach(a=>admAdd('Cursed Energy',a[0]+' CE',()=>{S.ce+=a[1];S.total+=a[1]}));
  admAdd('Fingers','+1 finger',()=>{S.fingers++});
  admAdd('Fingers','+10 fingers',()=>{S.fingers+=10});
  [3,10,20].forEach(n=>admAdd('Fingers','Eaten = '+n,()=>setEaten(n),n>=10));
  admAdd('Fingers','Eaten = 0',()=>{S.eaten=0;S.megumi=false;S.heian=false});
  CURSES.forEach(c=>admAdd('Spawn',c.n,()=>spawn(c)));
  admAdd('Spawn','Suguru Geto',()=>spawn(GETO));
  admAdd('Spawn','Heian Era Sukuna',()=>spawn(HEIAN));
  admAdd('Spawn','Kill current curse',()=>{S.cur.hp=0;checkCurse()});
  admAdd('Yuta and Gojo','Copy all techniques',()=>{Object.keys(COPY).forEach(k=>S.copied[k]=1)});
  admAdd('Yuta and Gojo','Revive Gojo',()=>{S.gojoDead=false});
  admAdd('Yuta and Gojo','Kill Gojo',()=>{S.gojoDead=true;if(S.char==='gojo')S.char='yuji'});
  admAdd('Yuta and Gojo','Unlock Yuta in Gojo body',()=>{S.swapped=true});
  admAdd('Yuta and Gojo','Reset cooldowns',()=>{S.cd={}});
  admAdd('Domain','Fill Domain charge',()=>{S.charge=DOMAIN_MAX});
  Object.keys(CUTS).forEach(k=>admAdd('Cutscenes','Play: '+k,()=>play([k]),true));
}
function admShow(){$('adm').hidden=false;$('alock').hidden=admOK;$('atools').hidden=!admOK;$('amsg').textContent='';if(!admOK)$('acode').focus()}
function admTry(){
  if($('acode').value.trim().toUpperCase()===ADMIN_CODE){admOK=true;if(!admBuilt){buildAdmin();admBuilt=true}admShow()}
  else $('amsg').textContent='Wrong code.';
  $('acode').value='';
}
$('aok').addEventListener('click',admTry);
$('acode').addEventListener('keydown',e=>{if(e.key==='Enter')admTry()});
$('aclose').addEventListener('click',()=>{$('adm').hidden=true});
$('admopen').addEventListener('click',admShow);
build();buildChars();buildTechs();buildAllies();render();
</script>

</body>
</html>
